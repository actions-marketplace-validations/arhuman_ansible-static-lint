version: 2

project_name: ansible-static-lint

before:
  hooks:
    - go mod tidy

builds:
  - id: astl
    main: ./cmd/astl
    binary: astl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # Keep the -X package path equal to the Makefile's VERSION_PKG.
      - -s -w
      # .Version drops the tag's leading v, which the other two build paths
      # keep: `git describe` stamps v0.1.0, and so does the module version a
      # `go install` reads back out of the build info. Put it back so all three
      # report the same string. Archive names below stay unprefixed.
      - -X main.Version=v{{ .Version }}
      - -X main.GitCommit={{ .ShortCommit }}
      - -X main.BuildDate={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# Both need a tool on PATH in CI: syft (SBOM) and cosign (signing). See
# .github/workflows/release.yml; without those installer steps goreleaser fails
# with "syft/cosign: executable file not found".
sboms:
  - artifacts: archive

# One Sigstore bundle, not a .sig plus a .pem: cosign 3 (what cosign-installer
# v4 puts on PATH) writes the new bundle format by default, ignores
# --output-signature/--output-certificate, and then fails on the empty --bundle
# path it was never given ("create bundle file: open : no such file or
# directory"). The bundle carries both the signature and the certificate.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum

# The Homebrew cask in arhuman/homebrew-tap, generated from the archives built
# above rather than written by hand. Before this, the tap carried a formula
# with four URLs and four checksums bumped manually, and it went stale at
# v0.6.0 without anything noticing: nothing in the release script or its
# checklist mentioned it.
#
# `homebrew_casks`, not `brews`: goreleaser hard-deprecated `brews` in v2.16
# (this repo's workflows pin `~> v2`, which resolves past that), and
# `goreleaser check` fails on it. Casks live in Casks/, so the tap's old
# Formula/ansible-static-lint.rb is deleted and tap_migrations.json maps the
# name, which is what keeps an existing `brew upgrade` working.
#
# GITHUB_TOKEN cannot be used here. It is scoped to the repository running the
# workflow, so pushing to the tap needs a token that can write to it: a
# fine-grained PAT limited to arhuman/homebrew-tap with contents:write, stored
# as the HOMEBREW_TAP_TOKEN secret.
#
# Windows is absent on purpose: Homebrew has no cask for it, and `ids` keeps
# the cask to the archives it can install.
homebrew_casks:
  - name: ansible-static-lint
    binaries:
      - astl
    ids:
      - default
    repository:
      owner: arhuman
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/arhuman/ansible-static-lint
    description: Fast static linter for Ansible playbooks and roles, no Python required
    license: MIT
    commit_author:
      name: goreleaser
      email: noreply@github.com
    commit_msg_template: "chore: bump {{ .ProjectName }} to {{ .Tag }}"
    # The archives are cosign-signed but not Apple-notarized, which is what
    # Gatekeeper checks, so a downloaded binary is quarantined and refuses to
    # run. Clearing the attribute is goreleaser's documented answer for an
    # unsigned cask; it does weaken a macOS protection, and notarization is
    # the real fix if this ever ships to a wider audience.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/astl"]
          end

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
