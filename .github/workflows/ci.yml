# CI for ansible-static-lint. Calls `make` targets so CI and local never drift.
# Tool versions are pinned here and in the Makefile; keep the two equal.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. release.yml gets write.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor = the go.mod minimum (keep in sync); "stable" = latest release,
        # which is also what release.yml ships with.
        go: ["1.26", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      # `make check` builds, so it replaces a bare `make build` here. It is also
      # the README quickstart, which keeps the first command a newcomer types
      # from being the one command nothing verifies.
      - name: Build and smoke check the examples
        run: make check
      - name: Test (race)
        run: make test

  lint:
    name: lint + vuln + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # Pre-install the pinned tools so `make audit` reuses them instead of
      # bootstrapping via `make tools`. Versions MUST equal the Makefile's.
      # Both floors exist for one reason: each tool builds an IR over the
      # stdlib, and Go 1.27 added promoted-field struct literals, which older
      # IR builders meet in internal/poll on linux and die on with
      # `unexpected expr: *ast.KeyValueExpr`. This job runs `go-version:
      # stable`, so it is where that stdlib lands first. golangci-lint v2.13.1
      # is the first release bundling staticcheck v0.8.0; govulncheck v1.7.0
      # carries an x/tools SSA builder new enough for the same reason. Neither
      # is a routine bump: do not lower them to match an older Go.
      - name: Install pinned tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      # make audit = coverage gate + go mod verify + golangci-lint + govulncheck.
      # One code path, local and CI.
      - name: Audit
        run: make audit

  parity:
    name: ansible-lint output parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ansible-static-lint
      # The reference corpus and frozen ansible-lint output live in a separate
      # repository because they carry ansible-lint test data (GPL-3.0-or-later).
      # ansible-static-lint itself ships none of it and stays MIT, so the corpus is fetched
      # here rather than vendored.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arhuman/astl-compatibility-check
          path: astl-compatibility-check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Assert output parity against the frozen corpus
        run: make -C ansible-static-lint parity

  bench:
    name: speed guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ansible-static-lint
      # Same split as the parity job, and for the same licensing reason: the
      # corpus this is timed against is ansible-lint test data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: arhuman/astl-compatibility-check
          path: astl-compatibility-check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # The budget is ~4x the current time, so a shared runner's noise cannot
      # trip it; only a structural regression does. astl's speed is the reason
      # it exists, and until this ran here nothing measured it automatically.
      - name: Assert the corpus lints within its budget
        run: make -C ansible-static-lint bench

  action:
    name: action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Runs the action against the examples fixture, which has a frozen
      # expected output and a known exit code. Asserting both is what separates
      # "the action ran" from "the action produced the right findings".
      #
      # This exercises the published release, not the working tree: the action
      # downloads a release archive by design, so a change to the archive layout
      # is only proven by the run that follows its release. Keep the version
      # pinned to the newest release rather than `latest`, so a failure here
      # names a known binary instead of drifting under the job.
      - id: run
        uses: ./
        with:
          paths: examples
          version: "0.6.0"
          output: astl-out.txt
          fail-on-findings: "false"
      - name: Assert exit code and output
        shell: bash
        env:
          CODE: ${{ steps.run.outputs.exit-code }}
        run: |
          set -euo pipefail
          if [ "$CODE" != "2" ]; then
            echo "::error::expected exit code 2 (violations found), got $CODE" >&2
            exit 1
          fi
          # astl normalizes every emitted path with filepath.ToSlash, so the
          # fixture is byte-comparable on Windows too; .gitattributes keeps the
          # checked-out fixture LF so only real differences show up here.
          diff -u examples/expected.txt astl-out.txt

  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Conventional Commits on PR commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/_.-]+\))?(!)?: .+'
          fail=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s' "$subject" | grep -qE "$pattern"; then
              echo "::error::commit $sha is not Conventional Commits: '$subject'"
              fail=1
            fi
          done
          exit $fail
